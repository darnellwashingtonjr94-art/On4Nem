on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-and-build:
    name: Test and Compile On4Nem Engine
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Resolve and Download Dependencies
        run: |
          go get github.com/ethereum/go-ethereum/crypto
          go mod tidy
          go mod download

      - name: Pre-compile Go Code
        run: CGO_ENABLED=0 go build ./...

      - name: Run Code Linter
        uses: golangci/golangci-lint-action@v6
        env:
          CGO_ENABLED: 0
        with:
          version: v1.64.8
          args: --timeout=5m
          skip-cache: true

      - name: Run Unit & Integration Tests
        run: |
          echo "Executing test suites..."
          go test -v ./...

      - name: Build Production Binary
        run: |
          echo "Compiling optimized standalone binary for Monad node infrastructure..."
          mkdir -p bin
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o bin/on4nem ./...
          echo "Build complete: bin/on4nem successfully compiled."

      - name: Archive Production Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: on4nem-linux-amd64
          path: bin/on4nem
